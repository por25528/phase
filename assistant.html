<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FAF9F7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase Assistant</title>
    <!-- The overlay window's page. It boots src/assistant/main.tsx — never the
         app entry — so the module graph reachable from here can be proven
         store-free (src/assistant/entryBoundary.test.ts is that proof).
         The no-FOUC script mirrors index.html so the overlay follows the same
         theme with no light flash. The overlay's own localStorage is a separate
         Electron partition, so the OS preference is the realistic source. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('phase-theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            var el = document.documentElement;
            el.classList.add('dark');
            el.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
          }
        } catch (e) {
          /* localStorage blocked — fall through to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/assistant/main.tsx"></script>
  </body>
</html>
