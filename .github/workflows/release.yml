name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # ── The Apple-account seam ────────────────────────────────────────────────
  # How `notarytool` authenticates. Change this one value to switch accounts:
  #
  #   api-key   App Store Connect API key. Needs the secrets
  #             APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER.
  #             Preferred: the key is scoped, revocable, and carries no 2FA.
  #
  #   apple-id  An Apple ID and an app-specific password. Needs the secrets
  #             APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  #
  # Either way the Developer ID certificate comes from MACOS_CERTIFICATE_P12_BASE64
  # and MACOS_CERTIFICATE_PASSWORD. See docs/macos-signing.md.
  PHASE_NOTARY_METHOD: api-key
  # The decoded App Store Connect key's filename. Only the NAME: it lives in
  # $RUNNER_TEMP, never the workspace, so nothing here can be packed into the
  # app or uploaded with the artifacts — and the `runner` context does not
  # exist at workflow level, so the directory is spelled per step instead.
  PHASE_API_KEY_NAME: apple-api-key.p8

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: PhaseApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PhaseApp/package-lock.json

      # First, because it needs nothing but node and the checkout: a missing or
      # malformed secret then costs seconds instead of an install, a suite, a
      # build and a signature. It reads the SECRETS — the key as base64 — which
      # it decodes in memory and discards. Names reach the log; values never do.
      - name: Preflight — release credentials
        env:
          PHASE_RELEASE_SIGNING: '1'
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_KEY_P8_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_TEAM_ID || '' }}
          PHASE_GOOGLE_CLIENT_ID: ${{ secrets.PHASE_GOOGLE_CLIENT_ID }}
          PHASE_GOOGLE_CLIENT_SECRET: ${{ secrets.PHASE_GOOGLE_CLIENT_SECRET }}
        run: node scripts/check-release-credentials.cjs

      - run: npm ci
      - run: npm test
      - run: npm run build

      # The OAuth client this build ships. It must exist BEFORE electron-builder
      # packs `electron/**`, or the release ships without one — which fails
      # nothing: the app simply asks every user for their own Google Cloud
      # project. The preflight above already refused a half pair, so by here
      # both are present; the writer checks again because it is also the path a
      # developer runs by hand.
      #
      # The pair is scoped to this ONE step. A workflow-level `env` would put
      # the client secret in the environment of every step, including the one
      # that uploads the artifacts.
      - name: Write the managed calendar OAuth client
        env:
          PHASE_GOOGLE_CLIENT_ID: ${{ secrets.PHASE_GOOGLE_CLIENT_ID }}
          PHASE_GOOGLE_CLIENT_SECRET: ${{ secrets.PHASE_GOOGLE_CLIENT_SECRET }}
        run: npm run calendar:credentials

      # notarytool wants the key as a file, so the base64 secret becomes one
      # here — and only here. The writer validates the alphabet, the round trip
      # and the PKCS#8 header before it writes, and writes nothing if any of
      # that fails, so no later step can half-use a corrupted key.
      - name: Materialise the App Store Connect key
        if: env.PHASE_NOTARY_METHOD == 'api-key'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: node scripts/write-apple-api-key.cjs "$RUNNER_TEMP/$PHASE_API_KEY_NAME"

      # electron-builder imports the certificate into a throwaway keychain of
      # its own, signs with the hardened runtime and the entitlements from
      # build/, then notarizes and staples the .app. APPLE_API_KEY is a PATH
      # here, never the base64 — a different name for a different thing.
      - name: Build, sign and notarize
        env:
          PHASE_RELEASE_SIGNING: '1'
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && format('{0}/{1}', runner.temp, env.PHASE_API_KEY_NAME) || '' }}
          APPLE_API_KEY_ID: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_TEAM_ID || '' }}
        run: npx electron-builder --mac --arm64 --x64 --publish never

      # electron-builder staples the .app but not the images around it, and
      # Gatekeeper assesses the downloaded DMG on its own.
      - name: Notarize and staple the disk images
        env:
          APPLE_API_KEY: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && format('{0}/{1}', runner.temp, env.PHASE_API_KEY_NAME) || '' }}
          APPLE_API_KEY_ID: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.PHASE_NOTARY_METHOD == 'api-key' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.PHASE_NOTARY_METHOD == 'apple-id' && secrets.APPLE_TEAM_ID || '' }}
        run: bash scripts/notarize-dmg.sh release/*.dmg

      # The gate. Nothing below this line runs unless the artifacts really are
      # Developer ID signed, hardened, notarized and stapled. The bundles and
      # images are discovered, not named: which architecture directories exist
      # is the build's business, and a hard-coded path that finds nothing reads
      # exactly like a check that passed.
      - name: Verify the artifacts
        run: node scripts/verify-build.cjs release

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/$PHASE_API_KEY_NAME"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: PhaseApp/release/*.dmg
          body_path: .github/release-notes.md
