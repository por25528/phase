<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FAF9F7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase Assistant</title>
    <!-- The overlay window's page. It boots src/assistant/main.tsx — never the
         app entry — so the module graph reachable from here can be proven
         store-free (src/assistant/entryBoundary.test.ts is that proof).
         The no-FOUC script mirrors index.html and paints the FIRST FRAME only.
         It is a guess and it is allowed to be: it reads the raw preference from
         a second renderer, falls back to the OS, and runs once per page load —
         while this window is created once and thereafter hidden and shown, not
         reloaded. The authority is `AssistantSnapshot.theme`, resolved by the
         owner and applied in AssistantOverlay.tsx the moment a snapshot lands.
         Deleting this script would not break the theme, only the first
         frame — which is precisely the flash it is here to prevent. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('phase-theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            var el = document.documentElement;
            el.classList.add('dark');
            el.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
          }
        } catch (e) {
          /* localStorage blocked — fall through to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/assistant/main.tsx"></script>
  </body>
</html>
